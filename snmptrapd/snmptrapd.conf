# snmptrapd.conf
# Accept traps from all hosts with community string "public"
authCommunity log,net,execute public

# Also accept SNMPv3 (optional — uncomment and configure if using v3)
# createUser trapUser MD5 "authpass" DES "privpass"
# authUser log,net,execute trapUser

# For all traps, call our handler script
# The script receives trap data via stdin and forwards to OTel as syslog
traphandle default /usr/local/bin/handler.sh

# Do NOT require authentication (accept any community)
disableAuthorization yes

# Log all received traps
doNotLogTraps no
